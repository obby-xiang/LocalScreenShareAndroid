syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.obby.android.localscreenshare.grpc.screenstream";
option java_outer_classname = "ScreenStream";

service ScreenStreamService {
  rpc Stream(stream ClientMessage) returns (stream ServerMessage) {}

  // Unary discovery handshake on the same port as the media stream. The request carries the
  // caller's discovery summary; the response carries the server's, so both sides learn each
  // other and can confirm reachability before a stream is opened.
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
}

message ClientMessage {
  oneof payload {
    Hello hello = 1;
    Ready ready = 2;
    RequestKeyframe request_keyframe = 3;
    Ping ping = 4;
    // Answer to one media channel offer. A server that never offered anything ignores it, and a
    // client that never heard of the field simply never sends it.
    MediaChannelEvent media_channel_event = 5;
  }
}

message Hello {
  int32 protocol_version = 1;
  // Session key of the stream hub; it may change when the same device reconnects.
  string client_id = 2;
  Capabilities capabilities = 3;
  // Stable discovery key and trust anchor; they bind the session to a discovery entry but do
  // not replace client_id as the session key.
  string device_id = 4;
  string fingerprint = 5;
  // Display name the server may show in its approval prompt. Empty means "declared none": a
  // client only fills this in when the user allows sharing its name.
  string device_name = 6;
  // Media channels this client can speak, by transport name ("tcp", "udp"). Empty means "the
  // gRPC stream only", which is also what an old client reports and what an old server assumes.
  repeated string media_transports = 7;
}

// Answer to one media channel offer. READY means the channel is established and the client waits
// for media on it; FAILED and CLOSED both return the call to the next candidate transport.
enum MediaChannelEventType {
  UNKNOWN_EVENT = 0;
  READY = 1;
  FAILED = 2;
  CLOSED = 3;
}

message MediaChannelEvent {
  bytes channel_id = 1;
  MediaChannelEventType type = 2;
  // Short English description for logs; never carries peer identity or payload bytes.
  string reason = 3;
}

// Discovery handshake. announces=true means the caller announced itself over multicast, so the
// server may send at most one announces=false Register back; announces=false ends the chain.
message RegisterRequest {
  int32 protocol_version = 1;
  bool announces = 2;
  DeviceSummary self = 3;
}

message RegisterResponse {
  int32 protocol_version = 1;
  bool accepted = 2;
  string reject_reason = 3;
  DeviceSummary self = 4;
}

// Discovery fields shared by the request and the response. The address list carries the
// endpoints the device accepts calls on; boot, seq and ttl stay multicast-only.
message DeviceSummary {
  string device_id = 1;
  string fingerprint = 2;
  string name = 3;
  string role = 4;
  string state = 5;
  string join = 6;
  bool secure = 7;
  string auth = 8;
  int32 metadata_version = 9;
  uint32 capabilities = 10;
  repeated DeviceAddress addresses = 11;
}

message DeviceAddress {
  string host = 1;
  int32 port = 2;
  int32 family = 3;
}

message Ready {}

message RequestKeyframe {}

// Application-level round-trip probe. The server echoes the fields verbatim and never adds its
// own clock, so the measurement needs no clock synchronisation. A peer that does not know the
// field treats the message as payload-not-set and ignores it.
message Ping {
  int32 seq = 1;
  int64 client_uptime_ms = 2;
}

// Echo of a Ping. It bypasses the media queue so the sample measures the path, not the queue.
message Pong {
  int32 seq = 1;
  int64 client_uptime_ms = 2;
}

message Capabilities {
  repeated CodecCapability codecs = 1;
  // Audio decoders the client can run. Empty means "no audio", which is also what an old client
  // that never heard of this field reports, so the server simply sends it no audio.
  repeated AudioCodecCapability audio_codecs = 2;
}

// Decode capability for one audio codec. A zero bound means "unconstrained", mirroring
// CodecCapability.
message AudioCodecCapability {
  string codec_id = 1;
  string mime = 2;
  int32 max_sample_rate = 3;
  int32 max_channels = 4;
  int32 max_bitrate_bps = 5;
}

message CodecCapability {
  string codec_id = 1;
  string mime = 2;
  string profile = 3;
  string level = 4;
  int32 max_width = 5;
  int32 max_height = 6;
  int32 max_frame_rate = 7;
  int32 max_bitrate_bps = 8;
  bool surface_output = 9;
  bool adaptive = 10;
}

message ServerMessage {
  oneof payload {
    Descriptor descriptor = 1;
    AccessUnit access_unit = 2;
    Pong pong = 3;
    // Audio travels on the same stream but keeps its own descriptor, epoch and access units, so a
    // client can ignore it entirely and still decode video.
    AudioDescriptor audio_descriptor = 4;
    AudioAccessUnit audio_access_unit = 5;
    // Tells the client that the server is waiting for its user to approve this request. Older
    // clients treat the message as payload-not-set and simply keep waiting; a grant never travels
    // here, it shows up as media, and a refusal ends the call with a reason.
    AuthorizationStatus authorization = 6;
    // Offer to move the media of this call onto a dedicated channel. Media keeps flowing on this
    // stream until the client says READY, so an old client that ignores the message loses nothing.
    MediaOffer media_offer = 7;
    // The offered channel is gone; the client drops its state for it and expects no more frames on
    // it. A call that never saw the offer ignores the message.
    MediaClose media_close = 8;
  }
}

// One media channel offer. Everything the client needs to establish the channel travels here, so
// the control stream stays the only negotiated path; the endpoint and key fields are empty for a
// build that cannot bind a channel yet.
message MediaOffer {
  bytes channel_id = 1;
  // Transport name, one of the values the client declared in its HELLO ("tcp", "udp").
  string transport = 2;
  string host = 3;
  int32 port = 4;
  bool secure = 5;
  // One-shot credential that binds the channel to this very call.
  bytes token = 6;
  bytes key_s2c = 7;
  bytes key_c2s = 8;
  bytes nonce_salt = 9;
  int32 mtu = 10;
  // Hint, in milliseconds, of the ceiling on the silence before the next fragment of an unfinished
  // access unit is due - not a bound on the whole assembly, which may take much longer while its
  // fragments keep arriving. The receiver measures the link itself and keeps the window local, so a
  // sender must not force a tighter threshold onto a link it does not measure.
  int32 hold_ms = 11;
}

message MediaClose {
  bytes channel_id = 1;
  string reason = 2;
}

message AuthorizationStatus {
  enum State {
    UNKNOWN = 0;
    // The request is parked on the server until its user answers or the approval window elapses.
    PENDING = 1;
  }

  State state = 1;
  // Seconds the server keeps the request open, so the client can show the same bound it faces.
  int32 timeout_seconds = 2;
}

// Decode configuration of the audio track. config_parts carries the AudioSpecificConfig (csd-0), so
// the receiver configures its decoder without parsing ADTS headers; the wire never carries ADTS.
message AudioDescriptor {
  int32 protocol_version = 1;
  int32 config_epoch = 2;
  string codec_id = 3;
  string mime = 4;
  string profile = 5;
  int32 sample_rate = 6;
  int32 channels = 7;
  int32 bitrate_bps = 8;
  // Samples per encoded frame; 1024 for AAC-LC, which is the only profile this version produces.
  int32 frame_samples = 9;
  repeated ConfigPart config_parts = 10;
  string config_hash = 11;
}

// One encoded audio frame. Audio has no key frames, so it carries no sync/join flags and no decode
// timestamp.
message AudioAccessUnit {
  int32 config_epoch = 1;
  int64 sequence = 2;
  int64 pts_us = 3;
  bytes payload = 4;
}

message Descriptor {
  int32 protocol_version = 1;
  int32 config_epoch = 2;
  string codec_id = 3;
  string mime = 4;
  string profile = 5;
  string level = 6;
  int32 coded_width = 7;
  int32 coded_height = 8;
  int32 visible_width = 9;
  int32 visible_height = 10;
  int32 rotation_degrees = 11;
  string bitstream_format = 12;
  repeated ConfigPart config_parts = 13;
  ColorInfo color = 14;
  string config_hash = 15;
  bool secure = 16;
  // Content frame-rate hint for the display side; 0 means unknown or cleared. It is deliberately
  // outside config_hash, so changing it never forces a decoder reconfiguration. An old client
  // reads 0 and simply keeps its current hint.
  int32 frame_rate = 17;
}

message ConfigPart {
  string id = 1;
  bytes payload = 2;
}

message ColorInfo {
  string color_space = 1;
  string transfer_function = 2;
  bool full_range = 3;
}

message AccessUnit {
  int32 config_epoch = 1;
  int64 sequence = 2;
  int64 pts_us = 3;
  int64 dts_us = 4;
  bool has_dts = 5;
  bool sync_point = 6;
  bool join_point = 7;
  bool config = 8;
  bytes payload = 9;
  repeated ConfigPart join_config_parts = 10;
  int32 temporal_layer_id = 11;
  bool has_temporal_layer_id = 12;
}
