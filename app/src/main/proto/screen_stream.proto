syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.obby.android.localscreenshare.grpc.screenstream";
option java_outer_classname = "ScreenStream";

service ScreenStreamService {
  rpc Stream(stream ClientMessage) returns (stream ServerMessage) {}

  // Unary discovery handshake on the same port as the media stream. The request carries the
  // caller's discovery summary; the response carries the server's, so both sides learn each
  // other and can confirm reachability before a stream is opened.
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
}

message ClientMessage {
  oneof payload {
    Hello hello = 1;
    Ready ready = 2;
    RequestKeyframe request_keyframe = 3;
  }
}

message Hello {
  int32 protocol_version = 1;
  // Session key of the stream hub; it may change when the same device reconnects.
  string client_id = 2;
  Capabilities capabilities = 3;
  // Stable discovery key and trust anchor; they bind the session to a discovery entry but do
  // not replace client_id as the session key.
  string device_id = 4;
  string fingerprint = 5;
}

// Discovery handshake. announces=true means the caller announced itself over multicast, so the
// server may send at most one announces=false Register back; announces=false ends the chain.
message RegisterRequest {
  int32 protocol_version = 1;
  bool announces = 2;
  DeviceSummary self = 3;
}

message RegisterResponse {
  int32 protocol_version = 1;
  bool accepted = 2;
  string reject_reason = 3;
  DeviceSummary self = 4;
}

// Discovery fields shared by the request and the response. The address list carries the
// endpoints the device accepts calls on; boot, seq and ttl stay multicast-only.
message DeviceSummary {
  string device_id = 1;
  string fingerprint = 2;
  string name = 3;
  string role = 4;
  string state = 5;
  string join = 6;
  bool secure = 7;
  string auth = 8;
  int32 metadata_version = 9;
  uint32 capabilities = 10;
  repeated DeviceAddress addresses = 11;
}

message DeviceAddress {
  string host = 1;
  int32 port = 2;
  int32 family = 3;
}

message Ready {}

message RequestKeyframe {}

message Capabilities {
  repeated CodecCapability codecs = 1;
}

message CodecCapability {
  string codec_id = 1;
  string mime = 2;
  string profile = 3;
  string level = 4;
  int32 max_width = 5;
  int32 max_height = 6;
  int32 max_frame_rate = 7;
  int32 max_bitrate_bps = 8;
  bool surface_output = 9;
  bool adaptive = 10;
}

message ServerMessage {
  oneof payload {
    Descriptor descriptor = 1;
    AccessUnit access_unit = 2;
  }
}

message Descriptor {
  int32 protocol_version = 1;
  int32 config_epoch = 2;
  string codec_id = 3;
  string mime = 4;
  string profile = 5;
  string level = 6;
  int32 coded_width = 7;
  int32 coded_height = 8;
  int32 visible_width = 9;
  int32 visible_height = 10;
  int32 rotation_degrees = 11;
  string bitstream_format = 12;
  repeated ConfigPart config_parts = 13;
  ColorInfo color = 14;
  string config_hash = 15;
  bool secure = 16;
}

message ConfigPart {
  string id = 1;
  bytes payload = 2;
}

message ColorInfo {
  string color_space = 1;
  string transfer_function = 2;
  bool full_range = 3;
}

message AccessUnit {
  int32 config_epoch = 1;
  int64 sequence = 2;
  int64 pts_us = 3;
  int64 dts_us = 4;
  bool has_dts = 5;
  bool sync_point = 6;
  bool join_point = 7;
  bool config = 8;
  bytes payload = 9;
  repeated ConfigPart join_config_parts = 10;
  int32 temporal_layer_id = 11;
  bool has_temporal_layer_id = 12;
}
