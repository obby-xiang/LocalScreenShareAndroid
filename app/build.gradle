plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.protobuf)
}

// Release signing material is optional and never lives in this repository. The lookup
// order is: the ignored root signing.properties, then four -Psigning.* properties, then
// nothing, which leaves the release APK unsigned. No value is ever logged.
def signingMaterialKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def signingMaterial = [:]
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) {
    def loaded = new Properties()
    signingPropertiesFile.withInputStream { loaded.load(it) }
    signingMaterialKeys.each { signingMaterial[it] = loaded.getProperty(it) }
} else {
    signingMaterialKeys.each { signingMaterial[it] = findProperty("signing.${it}") }
}
def isMissing = { value -> value == null || value.toString().trim().isEmpty() }
def hasSigningMaterial = signingMaterialKeys.every { !isMissing(signingMaterial[it]) }
def requireSigningMaterial = findProperty('requireSigning') == 'true'
if (!hasSigningMaterial) {
    if (signingMaterialKeys.every { isMissing(signingMaterial[it]) }) {
        logger.warn('Release signing is disabled: no signing material configured, '
            + 'so the release APK stays unsigned and must not be distributed.')
    } else {
        logger.warn('Release signing is disabled: the signing material is incomplete '
            + '(store file, store password, key alias and key password are all required; '
            + 'values are not logged).')
    }
}

android {
    namespace 'com.obby.android.localscreenshare'
    compileSdk 35

    defaultConfig {
        applicationId "com.obby.android.localscreenshare"
        minSdk 25
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasSigningMaterial) {
            release {
                storeFile rootProject.file(signingMaterial['storeFile'])
                storePassword signingMaterial['storePassword']
                keyAlias signingMaterial['keyAlias']
                keyPassword signingMaterial['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasSigningMaterial) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.5"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.71.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { option 'lite' }
            }
            task.plugins {
                grpc { option 'lite' }
            }
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    coreLibraryDesugaring libs.desugar.jdk.libs
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    implementation libs.gson
    implementation libs.grpc.okhttp
    implementation libs.grpc.protobuf.lite
    implementation libs.grpc.stub
    compileOnly libs.tomcat.annotations.api
    implementation libs.commons.lang3
    implementation libs.guava
    implementation libs.camera.core
    implementation libs.splashscreen
}

// Reported at the end of configuration so the missing material is the only failure a user sees.
if (requireSigningMaterial && !hasSigningMaterial) {
    throw new GradleException('release signing material is required (-PrequireSigning=true)')
}
