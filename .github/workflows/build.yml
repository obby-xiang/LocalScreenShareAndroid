name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest

      - name: Check test count against baseline
        run: |
          python3 scripts/checks/check_test_count.py \
            --results app/build/test-results/testDebugUnitTest \
            app/build/test-results/testReleaseUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug :app:lintRelease

      - name: Upload Test and Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/test-results/
            app/build/reports/
          retention-days: 30

  build:
    name: Build Android
    env:
      SIGNING_STORE_FILE: "${{ runner.temp }}/keystore.jks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create Keystore File
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: |
          echo "$SIGNING_STORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble (pull request)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Assemble
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest \
            -PrequireSigning=true \
            -Psigning.storeFile="$SIGNING_STORE_FILE" \
            -Psigning.storePassword="$SIGNING_STORE_PASSWORD" \
            -Psigning.keyAlias="$SIGNING_KEY_ALIAS" \
            -Psigning.keyPassword="$SIGNING_KEY_PASSWORD"

      - name: Remove Keystore File
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$SIGNING_STORE_FILE"

      - name: Upload Build Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: app/build/outputs/apk/**
