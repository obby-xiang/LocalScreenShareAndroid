name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z); releases are created only by a manual dispatch'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$TAG' does not match vX.Y.Z"
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Assert signed release APK
        run: |
          if [ ! -f dist/release/app-release.apk ]; then
            echo "signed release APK is missing: dist/release/app-release.apk"
            exit 1
          fi
          if compgen -G "dist/release/*-unsigned.apk"; then
            echo "unsigned release APK found: signing material was missing"
            exit 1
          fi
          count=$(find dist -name 'app-release.apk' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one app-release.apk, found $count"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA"
